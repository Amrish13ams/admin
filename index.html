<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 2rem; max-width: 450px; }
    .status-box { padding: 12px; border-radius: 6px; margin-bottom: 1.5rem; font-weight: bold; }
    .online { background: #dcfce7; color: #15803d; }
    .offline { background: #fee2e2; color: #b91c1c; }
    .btn { padding: 10px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.25rem; font-size: 0.85rem; color: #333; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    #modal { display: none; margin-top: 1.5rem; padding: 1.25rem; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; }
  </style>
</head>
<body>
  <h2>Remote Admin Dashboard</h2>
  
  <div id="statusBox" class="status-box offline">
    Catalog Status: Disconnected / Offline
  </div>

  <button id="openModalBtn" class="btn btn-primary" disabled onclick="toggleForm()">
    + Add Product
  </button>

  <div id="modal">
    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="pName" placeholder="e.g. Diamond Necklace" required />
    </div>

    <div class="form-group">
      <label>Product Weight (g)</label>
      <input type="number" id="pWeight" placeholder="e.g. 18.2" required />
    </div>

    <div class="form-group">
      <label>Product Image</label>
      <input type="file" id="pImage" accept="image/*" required />
    </div>

    <button id="uploadBtn" class="btn btn-success" disabled onclick="handleUpload()">
      Upload Product
    </button>
  </div>

  <script>
    const TARGET_CATALOG_ID = 'catalog-store-node-9988';
    let peer = new Peer();
    let conn = null;
    let isConnected = false;

    const statusBox = document.getElementById('statusBox');
    const openModalBtn = document.getElementById('openModalBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const modal = document.getElementById('modal');

    function connectToCatalog() {
      if (conn && conn.open) return;

      conn = peer.connect(TARGET_CATALOG_ID, { reliable: true });

      conn.on('open', () => {
        setOnlineStatus(true);
      });

      conn.on('data', (data) => {
        if (data.type === 'UPLOAD_SUCCESS') {
          alert('Product successfully saved to remote Catalog storage!');
        }
      });

      conn.on('close', () => {
        setOnlineStatus(false);
      });

      conn.on('error', () => {
        setOnlineStatus(false);
      });
    }

    peer.on('open', () => {
      // Continuously poll connection across the internet
      setInterval(() => {
        if (!conn || !conn.open) {
          connectToCatalog();
        }
      }, 3000);
    });

    function setOnlineStatus(online) {
      isConnected = online;
      if (online) {
        statusBox.textContent = 'Catalog Status: Online & Connected';
        statusBox.className = 'status-box online';
        openModalBtn.disabled = false;
        uploadBtn.disabled = false;
      } else {
        statusBox.textContent = 'Catalog Status: Offline';
        statusBox.className = 'status-box offline';
        openModalBtn.disabled = true;
        uploadBtn.disabled = true;
      }
    }

    function toggleForm() {
      if (!isConnected) return;
      modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }

    function handleUpload() {
      if (!isConnected || !conn || !conn.open) {
        alert('Catalog site is offline.');
        return;
      }

      const name = document.getElementById('pName').value.trim();
      const weight = document.getElementById('pWeight').value.trim();
      const fileInput = document.getElementById('pImage');

      if (!name || !weight || !fileInput.files[0]) {
        alert('Please fill out all fields.');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        conn.send({
          type: 'ADD_PRODUCT',
          payload: {
            id: Date.now(),
            name,
            weight,
            image: e.target.result
          }
        });

        // Reset form
        document.getElementById('pName').value = '';
        document.getElementById('pWeight').value = '';
        fileInput.value = '';
        modal.style.display = 'none';
      };

      reader.readAsDataURL(fileInput.files[0]);
    }
  </script>
</body>
</html>
