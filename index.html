<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 2rem; max-width: 450px; }
    .status-box { padding: 12px; border-radius: 6px; margin-bottom: 1.5rem; font-weight: bold; text-align: center; }
    .online { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .offline { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .btn { padding: 10px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.25rem; font-size: 0.85rem; color: #333; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    #modal { display: none; margin-top: 1.5rem; padding: 1.25rem; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; }
  </style>
</head>
<body>
  <h2>Catalog Management (Admin)</h2>
  
  <div id="statusBox" class="status-box offline">
    Catalog Status: Disconnected (Offline)
  </div>

  <button id="openModalBtn" class="btn btn-primary" disabled onclick="toggleForm()">
    + Add Product
  </button>

  <div id="modal">
    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="pName" placeholder="e.g. Diamond Necklace" required />
    </div>

    <div class="form-group">
      <label>Product Weight (g)</label>
      <input type="number" id="pWeight" placeholder="e.g. 18.5" step="0.01" required />
    </div>

    <div class="form-group">
      <label>Product Image</label>
      <input type="file" id="pImage" accept="image/*" required />
    </div>

    <button id="uploadBtn" class="btn btn-success" disabled onclick="handleUpload()">
      Upload Product
    </button>
  </div>

  <script>
    const CHANNEL_ID = 'catalog_sync_room_7788';
    const TOPIC_PING = `${CHANNEL_ID}/ping`;
    const TOPIC_HEARTBEAT = `${CHANNEL_ID}/heartbeat`;
    const TOPIC_UPLOAD = `${CHANNEL_ID}/upload`;

    let lastHeartbeat = 0;
    let isCatalogOnline = false;

    const statusBox = document.getElementById('statusBox');
    const openModalBtn = document.getElementById('openModalBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const modal = document.getElementById('modal');

    // Connect to HiveMQ Public WebSocket Broker
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
      clientId: 'admin_client_' + Math.random().toString(16).substring(2, 8),
      keepalive: 30,
      clean: true,
      reconnectPeriod: 2000
    });

    client.on('connect', () => {
      console.log('[Admin] Connected to HiveMQ Broker');
      client.subscribe(TOPIC_HEARTBEAT);
      client.publish(TOPIC_PING, 'ping');
    });

    client.on('message', (topic, message) => {
      if (topic === TOPIC_HEARTBEAT) {
        lastHeartbeat = Date.now();
        setOnlineStatus(true);
      }
    });

    // Monitor heartbeat every 1 second
    setInterval(() => {
      if (Date.now() - lastHeartbeat > 3000) {
        setOnlineStatus(false);
      }
    }, 1000);

    function setOnlineStatus(online) {
      isCatalogOnline = online;
      if (online) {
        statusBox.textContent = 'Catalog Status: Online';
        statusBox.className = 'status-box online';
        openModalBtn.disabled = false;
        uploadBtn.disabled = false;
      } else {
        statusBox.textContent = 'Catalog Status: Disconnected (Offline)';
        statusBox.className = 'status-box offline';
        openModalBtn.disabled = true;
        uploadBtn.disabled = true;
      }
    }

    function toggleForm() {
      if (!isCatalogOnline) return;
      modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }

    function handleUpload() {
      if (!isCatalogOnline) {
        alert('Catalog is currently offline.');
        return;
      }

      const name = document.getElementById('pName').value.trim();
      const weight = document.getElementById('pWeight').value.trim();
      const fileInput = document.getElementById('pImage');

      if (!name || !weight || !fileInput.files[0]) {
        alert('Please fill out all fields.');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const payload = {
          id: Date.now(),
          name,
          weight,
          image: e.target.result
        };

        client.publish(TOPIC_UPLOAD, JSON.stringify(payload));

        document.getElementById('pName').value = '';
        document.getElementById('pWeight').value = '';
        fileInput.value = '';
        modal.style.display = 'none';
        alert('Product dispatched to local catalog!');
      };

      reader.readAsDataURL(fileInput.files[0]);
    }
  </script>
</body>
</html>
